<app-modal title="Edit Reservation" (closed)="onClose()">
  <p class="subtitle">
    {{ locationName() }} · Table {{ table().tableNumber }} · {{ date() | date: 'MMM d, y' }}
  </p>

  <div class="row">
    <div class="field field-time">
      <span class="field-label">Time</span>
      <app-custom-select
        [showIcon]="false"
        [placeholder]="'Choose time'"
        [options]="timeOptions()"
        [selectedOption]="selectedTimeOption()"
        (optionSelected)="onStartSelected($event)"
      />
    </div>

    <div class="field field-guests">
      <span class="field-label">Guests</span>
      <app-custom-number
        [showIcon]="false"
        [minValue]="1"
        [maxValue]="table().capacity"
        [currentValue]="selectedGuests()"
        (currentValueChange)="onGuestsChange($event)"
      />
    </div>
  </div>

  <div class="field">
    <span class="field-label">How long would you like to stay?</span>
    <app-custom-select
      class="duration-select"
      [showIcon]="false"
      [placeholder]="'Choose duration'"
      [options]="durationOptions"
      [selectedOption]="selectedDurationOption()"
      (optionSelected)="onDurationSelected($event)"
    />
  </div>

  <label class="price-toggle" [class.price-toggle--disabled]="selectedGuests() < 2">
    <input
      type="checkbox"
      role="switch"
      [checked]="selectedHidePrices()"
      [disabled]="selectedGuests() < 2"
      (change)="onHidePricesChange($event)"
    />
    <span class="price-toggle__text">
      <strong>Hide prices for guests</strong>
      <small>
        {{ selectedGuests() < 2 ? 'Available for reservations with 2 or more guests.' : selectedHidePrices() ? 'Guests will not see dish prices in the pre-order.' : 'Turn on so that guests do not see dish prices in the pre-order.' }}
      </small>
    </span>
  </label>

  <p class="note">
    Need more time or want to make changes?<br />
    Give us a call at +123 445 678 8990.
  </p>

  <div modal-actions class="actions">
    <button
      type="button"
      class="button button--primary button--extra-large button--full-width save-btn"
      (click)="onSave()"
    >
      Save Changes
    </button>
  </div>
</app-modal>
